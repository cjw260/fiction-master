services:
  fiction-master:
    build: .
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./fiction:/app/fiction:ro
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - backend/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

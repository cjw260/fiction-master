[project]
name = "fiction-master-backend"
version = "0.1.0"
description = "RAG agent backend for Fiction Master"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.22.0",
  "alembic>=1.16.0",
  "beautifulsoup4>=4.13.0",
  "charset-normalizer>=3.4.0",
  "ebooklib>=0.19",
  "fastapi>=0.135.0",
  "greenlet>=3.2.0",
  "httpx>=0.28.0",
  "jieba>=0.42.1",
  "langgraph>=1.0.0",
  "openai>=2.0.0",
  "pydantic-settings>=2.10.0",
  "python-frontmatter>=1.1.0",
  "qdrant-client>=1.15.0",
  "sqlalchemy>=2.0.40",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1.0",
  "pyright>=1.1.400",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.1.0",
  "respx>=0.22.0",
  "ruff>=0.12.0",
]

[project.scripts]
fiction-master = "fiction_master.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiction_master"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "ASYNC240"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=fiction_master --cov-report=term-missing"
